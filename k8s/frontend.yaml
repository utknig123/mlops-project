apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stockgod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: streamlit
          image: stockgod-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: http://api:8000
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stockgod
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30501
