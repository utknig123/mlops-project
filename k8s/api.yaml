apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: stockgod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: stockgod-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://admin:admin123@postgres:5432/sentiment_db
            - name: MONGODB_URL
              value: mongodb://admin:admin123@mongodb:27017/sentiment_db?authSource=admin
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: KAFKA_BROKER
              value: kafka:29092
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: stockgod
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
